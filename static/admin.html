<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration écran</title><link rel="stylesheet" href="/style.css"></head><body class="admin"><main><a href="/" class="back">← Voir l'écran</a><h1>Administration de l’écran</h1><section id="login"><h2>Connexion</h2><input type="password" id="password" placeholder="Mot de passe administrateur"><button id="loginBtn">Se connecter</button><p class="error"></p><p class="hint">Prototype : définissez <code>ADMIN_PASSWORD</code> avant toute mise en ligne.</p></section><section id="panel" hidden><div class="toolbar"><h2>Identité & informations</h2><button id="logout">Déconnexion</button></div><form id="settingsForm" class="card"><label>Nom du lieu<input name="venue_name"></label><label>Phrase d’accueil<input name="tagline"></label><label>Couleur principale<input name="primary_color" type="color"></label><label>Durée d'une annonce (secondes)<input name="rotation_seconds" type="number" min="3" max="120"></label><label>Titre de la fenêtre d'information<input name="info_title"></label><label>Texte des informations<textarea name="info_body"></textarea></label><button>Enregistrer les réglages</button></form><div class="toolbar"><h2>Annonces du carousel</h2><button id="newSlide">+ Nouvelle annonce</button></div><div id="slides"></div></section></main><template id="slideTemplate"><form class="card slideForm"><input type="hidden" name="id"><label>Titre<input name="title" required></label><label>Texte<textarea name="body" required></textarea></label><label>Image (URL, facultatif)<input name="image" type="url" placeholder="https://..."></label><label>Bouton / appel à l'action<input name="cta" placeholder="Ex. Voir le programme"></label><label>Ordre<input name="position" type="number"></label><label class="check"><input name="active" type="checkbox" checked> Afficher cette annonce</label><div class="actions"><button>Enregistrer</button><button type="button" class="danger">Supprimer</button></div></form></template><script src="/admin.js"></script></body></html>
